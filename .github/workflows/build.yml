name: Build

on:
  push:
    branches:
      - develop
      - "[0-9]*.x"
  pull_request:
    branches:
      - develop
      - "[0-9]*.x"
  workflow_dispatch:

concurrency:
  group: "build-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest

    outputs:
      php: ${{ steps.php.outputs.versions }}
      lowest: ${{ steps.php.outputs.lowest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Every Laravel line declares its PHP range as ">=8.A <8.B" in
      # composer.json, so the same workflow works on every N.x line.
      - name: Read the supported PHP minors
        id: php
        shell: bash
        run: |
          constraint="$(jq -r '.require.php' composer.json)"

          if [[ ! "$constraint" =~ ^\>=8\.([0-9]+)\ \<8\.([0-9]+)$ ]]; then
            echo "require.php must read \">=8.A <8.B\", got: $constraint" >&2
            exit 1
          fi

          versions="$(seq "${BASH_REMATCH[1]}" $((BASH_REMATCH[2] - 1)) | sed 's/^/8./' | jq -Rnc '[inputs]')"

          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "lowest=8.${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  build:
    name: PHP ${{ matrix.php }} - ${{ matrix.os }} - ${{ matrix.dependencies }}
    needs: matrix

    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.matrix.outputs.php) }}
        dependencies:
          - lowest
          - highest
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      # Pint and PHPStan run once, on the lowest PHP with the highest
      # dependencies: a newer PHP installs a newer Pint with extra rules.
      - name: Check
        if: matrix.os == 'ubuntu-latest' && matrix.php == needs.matrix.outputs.lowest && matrix.dependencies == 'highest'
        run: composer check

      - name: Run tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.php == needs.matrix.outputs.lowest && matrix.dependencies == 'highest') }}
        run: composer test

  # The scopes compile different SQL per engine, and the parallel-writer tests
  # need a server, so the suite also runs on MySQL, MariaDB and PostgreSQL.
  databases:
    name: ${{ matrix.database }} - PHP ${{ needs.matrix.outputs.lowest }}
    needs: matrix

    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mysql
            image: mysql:8.4
            port: 3306
            options: --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret" --health-interval=5s --health-timeout=5s --health-retries=20
          - database: mariadb
            image: mariadb:11
            port: 3306
            options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
          - database: pgsql
            image: postgres:16
            port: 5432
            options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=20

    runs-on: ubuntu-latest

    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: translatable
          MARIADB_ROOT_PASSWORD: secret
          MARIADB_DATABASE: translatable
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: translatable
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: ${{ matrix.options }}

    env:
      TRANSLATABLE_DB: ${{ matrix.database }}
      TRANSLATABLE_DB_HOST: 127.0.0.1
      TRANSLATABLE_DB_PORT: ${{ matrix.port }}
      TRANSLATABLE_DB_DATABASE: translatable
      TRANSLATABLE_DB_PASSWORD: secret

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ needs.matrix.outputs.lowest }}
          extensions: fileinfo, pcntl, pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: Run tests
        run: composer test
